# 质量门禁（plan 第 14 节）：任何一项失败不能合并。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: groonga/pgroonga:4.1.0-debian-18 # PostgreSQL 18.6 + PGroonga 4.1.0，与 deploy/dev/compose.yaml 一致
        env:
          POSTGRES_USER: akari
          POSTGRES_PASSWORD: akari-ci
          POSTGRES_DB: akari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akari" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9.1.2
        ports: ["6379:6379"]
    env:
      # 编译期用仓库里的 .sqlx 离线元数据；测试运行时 sqlx::test 用 DATABASE_URL 建临时库。
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://akari:akari-ci@127.0.0.1:5432/akari
      VALKEY_URL: redis://127.0.0.1:6379
      # 缺少测试前提（anvil、forge、jq、Valkey、S3、合约产物）时测试直接失败而不是跳过（forum-testkit）
      AKARI_TEST_STRICT: "1"
      # 下一步启动的 S3 兼容服务；测试自己建存储桶
      MEDIA_S3_ENDPOINT: http://127.0.0.1:8333
      MEDIA_S3_BUCKET: akari-ci
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_ACCESS_KEY: akari-dev
      MEDIA_S3_SECRET_KEY: akari-dev-only-secret
      MEDIA_PUBLIC_BASE: http://127.0.0.1:8333/akari-ci/
    steps:
      - uses: actions/checkout@v5
      # 与 deploy/dev/compose.yaml 的 `s3` 服务相同（镜像、身份文件）。服务容器不能传启动参数，所以用 docker run
      - run: >-
          docker run -d --name s3 --memory 512m -p 127.0.0.1:8333:8333
          -v "$GITHUB_WORKSPACE/deploy/dev/s3-identities.json:/etc/seaweedfs/s3.json:ro"
          chrislusf/seaweedfs:3.97 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          -master.volumeSizeLimitMB=64 -volume.max=8
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit,sqlx-cli@0.9.0,cargo-llvm-cov@0.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo deny check
      - run: cargo audit
      # 离线元数据必须与迁移后的真实数据库一致
      # 规划器参数与开发、生产一致（plan 第 8 节），否则 sqlx 按执行计划推断的可空性会不同
      - run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET random_page_cost = 1.1" -c "ALTER SYSTEM SET effective_io_concurrency = 200" -c "SELECT pg_reload_conf()"
      - run: sqlx migrate run --source crates/db/migrations
      - run: SQLX_OFFLINE=false cargo sqlx prepare --workspace --check -- --all-targets
      # anvil / forge 集成测试（代付、拍卖、indexer、ABI 与字节码新鲜度）要用；jq 是 runner 自带的
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge build
        working-directory: contracts
      - run: timeout 60 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:8333/; do sleep 1; done'
      # 测试只跑一遍（插桩构建），顺带产出行覆盖率；合约绑定（sol! 宏）与测试代码不计入
      # 门槛：全部 ≥ 88%（引入时 89.8% 减 1 个百分点取整），core 与 db 层各 ≥ 80%（plan 第 14 节）
      - run: >-
          cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
          --ignore-filename-regex '(/tests/|crates/chain/src/bindings\.rs)' --fail-under-lines 88
      - run: |
          awk -F'[:,]' '/^SF:/{c=""; if ($2 ~ /\/crates\/(core|db)\/src\//) {c=$2; sub(/.*\/crates\//, "", c); sub(/\/.*/, "", c)}}
            /^LF:/{if (c) lf[c]+=$2} /^LH:/{if (c) lh[c]+=$2}
            END{if (length(lf) < 2) {print "core/db missing from lcov.info"; bad=1}; for (c in lf) {p=100*lh[c]/lf[c]; printf "%s: %.2f%%\n", c, p; if (p < 80) bad=1}; exit bad}' lcov.info
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rust-lcov
          path: backend/lcov.info
          if-no-files-found: ignore

  # 生产用 musl 静态可执行文件（plan 第 13 节）；aws-lc、vendored OpenSSL 都要在这里编得过
  rust-musl:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools cmake
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --bins
      - run: file target/x86_64-unknown-linux-musl/release/forum-api | grep -q "static"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm knip
      # 重复率 < 3%（plan 第 14 节），扫 TS 与 Rust，配置见仓库根的 .jscpd.json
      - run: pnpm dup
      - run: pnpm turbo run lint typecheck test build

  contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      # 合约行覆盖率必须 100%（plan 第 14 节）
      - run: |
          forge coverage --report lcov --report summary
          awk -F'[:,]' '/^SF:/{f=$2} /^LF:/{lf=$2} /^LH:/{if (f ~ /^src\// && $2 != lf) {print "coverage < 100%: " f " " $2 "/" lf; bad=1}} END{exit bad}' lcov.info
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from slither-analyzer==0.11.6 slither . --exclude-dependencies --filter-paths "lib/|test/" --fail-high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from ansible-core ansible-galaxy collection install -r requirements.yml -p collections
      - run: uvx --from ansible-lint --with ansible-core ansible-lint site.yml
      - run: shellcheck -S warning ../install-release.sh
      - run: shellcheck -S warning ../check-origin-exposure.sh
      - run: shellcheck -S warning -x ../lib.sh ../dev/aa.sh ../testnet/testnet.sh ../testnet/rehearse.sh
