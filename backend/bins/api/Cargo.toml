[package]
name = "forum-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "forum-api"
path = "src/main.rs"

[dependencies]
alloy.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
axum-extra.workspace = true
forum-auth.workspace = true
forum-chain.workspace = true
forum-content.workspace = true
forum-core = { workspace = true, features = ["openapi"] }
forum-db.workspace = true
forum-kv.workspace = true
forum-media.workspace = true
forum-runtime.workspace = true
futures-util = { workspace = true, features = ["sink"] }
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower.workspace = true
tower-http.workspace = true
tower-sessions.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
forum-testkit.workspace = true
tokio-tungstenite = "0.29"
forum-chain = { workspace = true, features = ["anvil"] }
webauthn-authenticator-rs.workspace = true
redis.workspace = true
tower.workspace = true
# 拍卖端到端（tests/auction_e2e.rs）：真实的 forum-sponsor、forum-worker 结算与 forum-indexer。
alloy = { workspace = true, features = ["signer-local", "network"] }
forum-indexer = { path = "../indexer" }
forum-sponsor = { path = "../sponsor" }
forum-worker = { path = "../worker" }
tokio-util.workspace = true

[lints]
workspace = true
