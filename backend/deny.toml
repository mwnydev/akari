[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# 均为宽松许可证。0BSD：resend-rs、quoted_printable、mailparse；CDLA-Permissive-2.0：webpki-roots 的根证书数据；
# BSL-1.0：Boost 许可证（依赖树中的小工具库）。
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "0BSD", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
