[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# paste：只是个编译期宏（alloy-primitives 的依赖），作者归档不再维护，没有已知漏洞；等 alloy 换掉后删除。
# webpki-roots 0.26.11：只是转发到 1.x 的空壳（tokio-tungstenite 经 alloy-transport-ws 引入），根证书数据来自已修复的 1.0.10；
# 公告按版本号匹配到了它。tokio-tungstenite 改依赖 1.x 后删除。
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "proc-macro only, via alloy-primitives; no vulnerability" },
  { id = "RUSTSEC-2026-0381", reason = "only matched webpki-roots 0.26.11, a shim re-exporting 1.x locked at the fixed 1.0.10" },
]

[licenses]
version = 2
# 均为宽松许可证。0BSD：resend-rs、quoted_printable、mailparse；CDLA-Permissive-2.0：webpki-roots 的根证书数据；
# BSL-1.0：Boost 许可证（依赖树中的小工具库）。
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "0BSD", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold = 0.9
# Unlicense（公有领域声明）：alloy-transport-ws 只在 wasm32 目标上用的 WebSocket 依赖，服务器构建不编译它们。
exceptions = [
  { allow = ["Unlicense"], crate = "ws_stream_wasm" },
  { allow = ["Unlicense"], crate = "async_io_stream" },
  { allow = ["Unlicense"], crate = "pharos" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
