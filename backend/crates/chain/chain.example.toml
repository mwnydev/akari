# 链配置示例（单链 Arbitrum One）。RPC 地址带密钥，留空并用环境变量提供：
#   CHAIN_RPC_PRIMARY_HTTP / CHAIN_RPC_PRIMARY_WS / CHAIN_RPC_BACKUP_HTTP / CHAIN_RPC_BACKUP_WS
# forum-indexer、forum-api 与 forum-sponsor 用 CHAIN_CONFIG=<本文件路径> 指定。
# Arbitrum Sepolia 的实际配置由 deploy/testnet/testnet.sh emit-config 从部署记录生成（docs/runbooks/testnet-deploy.md）。
chain_id = 42161
name = "Arbitrum One"

[contracts]
# 部署后填写（contracts/script/Deploy.s.sol 输出）；这里是占位地址。
escrow = "0x0000000000000000000000000000000000000001"
stream = "0x0000000000000000000000000000000000000003"
config = "0x0000000000000000000000000000000000000002"
start_block = 0

[token]
symbol = "USDT0"
address = "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"
decimals = 6

# 账户抽象（ADR 0003、0004），forum-sponsor 使用。EntryPoint v0.7 与 Kernel v3.3 meta factory 是链上现成合约。
[aa]
entry_point = "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
paymaster = "0x0000000000000000000000000000000000000004"
factories = ["0xd703aaE79538628d27099B8c4f621bE4CCd142d5"]

[confirmation]
use_block_tags = true
fallback_safe_depth = 240
fallback_finalized_depth = 4800

# 补拉校对间隔：生产默认 20 秒（Infura 免费档预算，docs/runbooks/testnet-deploy.md「RPC 用量」）；
# 环境变量 INDEXER_RECONCILE_MS 可覆盖。实时显示靠 WebSocket 订阅，补拉只负责校对与回滚。
[indexer]
reconcile_interval_ms = 20000
max_block_range = 2000
promote_every = 6
failback_secs = 300

# 钱包初始化参数版本（ADR 0008）：钱包地址由这些参数和 Passkey 公钥决定，已用过的版本绝不能改，
# 换 Paymaster 或代币时追加新版本。Kernel v3.3 与 WebAuthn 验证器是 ZeroDev 的公开部署（ADR 0003）；
# paymaster 为部署后的 FixedFeePaymaster（这里是占位地址）。
[[wallet_init_versions]]
version = 1
kernel_implementation = "0xd6CEDDe84be40893d153Be9d467CD6aD37875b28"
kernel_factory = "0x2577507b78c2008Ff367261CB6285d44ba5eF2E9"
kernel_meta_factory = "0xd703aaE79538628d27099B8c4f621bE4CCd142d5"
webauthn_validator = "0x7ab16Ff354AcB328452F1D445b3Ddee9a91e9e69"
entry_point = "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
paymaster = "0x0000000000000000000000000000000000000004"
approve_token = "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"
approve_amount = "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"
