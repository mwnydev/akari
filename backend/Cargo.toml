[workspace]
resolver = "3"
members = ["bins/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
forum-core = { path = "crates/core" }
forum-db = { path = "crates/db" }
forum-chain = { path = "crates/chain" }
forum-runtime = { path = "crates/runtime" }
forum-auth = { path = "crates/auth" }
forum-kv = { path = "crates/kv" }
forum-mail = { path = "crates/mail" }
forum-content = { path = "crates/content" }

tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "=0.8.9"
tower-http = { version = "=0.7.1", features = ["trace", "timeout", "compression-gzip"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "json", "time"] }
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp", "script"] }
deadpool-redis = { version = "=0.23.1", features = ["rt_tokio_1"] }
tower-sessions = { version = "=0.15.0", default-features = false, features = ["axum-core", "signed"] }
tower-sessions-core = { version = "=0.15.0" }
axum-extra = { version = "=0.12.6", features = ["cookie-signed"] }
utoipa = { version = "=6.0.0", features = ["axum_extras", "time"] }
utoipa-axum = "=0.3.0"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
resend-rs = { version = "=0.34.0", default-features = false, features = ["rustls-tls"] }
hmac = "=0.13.0"
sha2 = "=0.11.1"
rand = "=0.10.3"
hex = "0.4"
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
ammonia = "=4.2.4" # 4.2.3 有 RUSTSEC-2026-0373，计划锁定版本因安全补丁上调
# 钱包 Passkey（plan 第 5 节）。状态需存 Valkey 5 分钟，故开启状态序列化。
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }
# webauthn-rs 依赖 OpenSSL；musl 静态构建时用 vendored 源码编译。
openssl = { version = "0.10", features = ["vendored"] }
# EIP-712 报价哈希（keccak256），与合约 `Escrow.hashOffer` 逐字节一致。
sha3 = "=0.12.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
