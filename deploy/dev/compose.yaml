# 本机开发依赖（plan 第 13 节「本机 WSL2」）。生产不用 Docker，见 deploy/ansible。
name: akari-dev
services:
  postgres:
    image: groonga/pgroonga:4.1.0-debian-18 # PostgreSQL 18.6 + PGroonga 4.1.0
    environment:
      POSTGRES_USER: akari
      POSTGRES_PASSWORD: akari-dev-only
      POSTGRES_DB: akari
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - auto_explain.log_min_duration=50ms
      - -c
      - default_toast_compression=lz4
      - -c
      - jit=off
      # 与生产一致（plan 第 8 节）：NVMe 随机读接近顺序读，否则规划器会选错索引方案
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akari"]
      interval: 5s
  valkey:
    image: valkey/valkey:9.1.2
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [valkeydata:/data]
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  # 本地 R2 替身（S3 兼容）：图片上传与处理（plan 第 12 节）。MinIO 已停止发布社区版镜像，改用 SeaweedFS。
  # 开发凭据见 backend/.env.example 的 MEDIA_S3_*；匿名身份只读，模拟 R2 公开域名（CDN）读取正式目录。
  s3:
    image: chrislusf/seaweedfs:3.97
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=64
      - -volume.max=8
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    ports: ["127.0.0.1:${S3_PORT:-8333}:8333"]
    volumes: [s3data:/data]
  # ── 本地 AA 开发链（profile `aa`，用法见 README-aa.md；由 aa.sh 编排，不随默认 `up` 启动）──
  # 两个服务都用宿主机网络：容器里能直接用宿主机上的 HTTP(S)_PROXY（127.0.0.1:*）去 fork 公共 RPC，
  # 浏览器、forge、Playwright 都按 127.0.0.1 访问。端口只监听 127.0.0.1（Alto 见下面的 alto-loopback）。
  # 端口由 aa.sh 的 ANVIL_PORT / BUNDLER_PORT 传入；多份检出同时运行时各用各的端口与 compose 项目名（AA_PROJECT）。
  anvil:
    profiles: [aa]
    image: ghcr.io/foundry-rs/foundry:v1.8.3@sha256:2e4287278639262de76db72477301d5d3212fa1b1cce710d7d148750a46ce9e7
    network_mode: host
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: 127.0.0.1,localhost
      PORT: ${ANVIL_PORT:-8545}
      FORK_URL: ${AA_FORK_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      FORK_BLOCK: ${AA_FORK_BLOCK:-}
    # 链 ID 改成 31337：本地签的报价和代付签名不可能拿到真实 Sepolia 上重放。
    # Osaka 带 EIP-7951 secp256r1 预编译（地址 0x100，与 Arbitrum 的 RIP-7212 相同），Passkey 验签走预编译。
    command:
      - >-
        exec anvil --host 127.0.0.1 --port $$PORT --fork-url $$FORK_URL --chain-id 31337
        $${FORK_BLOCK:+--fork-block-number $$FORK_BLOCK} --hardfork osaka --block-time 1
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:${ANVIL_PORT:-8545}"]
      interval: 2s
      retries: 60
  alto:
    profiles: [aa]
    image: ghcr.io/pimlicolabs/alto:v1.2.8@sha256:f2661042aadefc6a4fc9c5826a14404f574c7ef2de76bdf83fe6a0829137b3c5
    network_mode: host
    depends_on:
      anvil: { condition: service_healthy }
    # Alto 把监听地址写死成 0.0.0.0，宿主机网络下局域网可达；预加载脚本把它改成 127.0.0.1（aa.sh 启动后再核对）。
    environment:
      NODE_OPTIONS: --require /etc/alto/loopback.cjs
    configs:
      - source: alto-loopback
        target: /etc/alto/loopback.cjs
    # 执行者 / 工具账户是 aa.sh 里由固定字符串派生的「仅开发」私钥，aa.sh 先给它们打 ETH 再启动本服务。
    command:
      - --entrypoints=0x0000000071727De22E5E9d8BAf0edAc6f37da032
      - --rpc-url=http://127.0.0.1:${ANVIL_PORT:-8545}
      - --port=${BUNDLER_PORT:-4337}
      - --executor-private-keys=0x4b59fffb20b6a428033e838e647ab25b873c59287ad1778ee9faea5c91304df4 # gitleaks:allow 本地 Anvil 专用，由公开字符串派生，无真实价值
      - --utility-private-key=0xa94dbb4a79378cae9fcf3f94dcbc052d91bc563a60dc0df5f13b7af91e1568de # gitleaks:allow 本地 Anvil 专用
      - --safe-mode=false
      - --enable-cors=true
      - --block-time=1000
      - --log-level=info
configs:
  alto-loopback:
    content: |
      const net = require("node:net");
      const listen = net.Server.prototype.listen;
      net.Server.prototype.listen = function (...args) {
        const opts = args[0];
        const wildcard = (h) => h === undefined || h === "0.0.0.0" || h === "::";
        if (opts && typeof opts === "object" && opts.path === undefined && wildcard(opts.host)) {
          args[0] = { ...opts, host: "127.0.0.1" };
        } else if (typeof opts === "number" && (typeof args[1] !== "string" || wildcard(args[1]))) {
          args.splice(1, typeof args[1] === "string" ? 1 : 0, "127.0.0.1");
        }
        return listen.apply(this, args);
      };
  s3-identities:
    content: |
      {"identities": [
        {"name": "anonymous", "actions": ["Read"]},
        {"name": "dev", "credentials": [{"accessKey": "akari-dev", "secretKey": "akari-dev-only-secret"}],
         "actions": ["Admin", "Read", "Write", "List", "Tagging"]}
      ]}
volumes:
  pgdata:
  valkeydata:
  s3data:
