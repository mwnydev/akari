# 本机开发依赖（plan 第 13 节「本机 WSL2」）。生产不用 Docker，见 deploy/ansible。
name: akari-dev
services:
  postgres:
    image: groonga/pgroonga:4.1.0-debian-18 # PostgreSQL 18.6 + PGroonga 4.1.0
    environment:
      POSTGRES_USER: akari
      POSTGRES_PASSWORD: akari-dev-only
      POSTGRES_DB: akari
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - auto_explain.log_min_duration=50ms
      - -c
      - default_toast_compression=lz4
      - -c
      - jit=off
      # 与生产一致（plan 第 8 节）：NVMe 随机读接近顺序读，否则规划器会选错索引方案
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akari"]
      interval: 5s
  valkey:
    image: valkey/valkey:9.1.2
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [valkeydata:/data]
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
  valkeydata:
