- name: Service users (one low-privilege user per program)
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: "{{ ['valkey'] if item in ['forum-api', 'forum-worker'] else [] }}"
    append: true
  loop: "{{ (app_services | map(attribute='user') | list + ['forum-web']) | unique }}"

- name: Download Node.js
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ node_version }}/node-v{{ node_version }}-linux-x64.tar.xz"
    dest: "/opt/node-v{{ node_version }}.tar.xz"
    checksum: "sha256:{{ node_sha256 }}"
    mode: "0644"

- name: Unpack Node.js
  ansible.builtin.unarchive:
    src: "/opt/node-v{{ node_version }}.tar.xz"
    dest: /opt
    remote_src: true
    creates: "/opt/node-v{{ node_version }}-linux-x64/bin/node"

- name: GitHub CLI for build attestation checks
  ansible.builtin.apt:
    name: gh
    state: present

- name: Release directories
  ansible.builtin.file:
    path: "{{ app_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [releases, bin]

- name: Release install script (the only thing the deploy account may run as root)
  ansible.builtin.copy:
    src: ../../../install-release.sh
    dest: "{{ app_root }}/bin/install-release"
    owner: root
    group: root
    mode: "0755"

- name: Restrict deploy account via sudoers
  ansible.builtin.copy:
    dest: /etc/sudoers.d/akari-deploy
    mode: "0440"
    validate: visudo -cf %s
    content: |
      {{ ansible_user }} ALL=(root) NOPASSWD: {{ app_root }}/bin/install-release *

- name: Configuration directory
  ansible.builtin.file:
    path: /etc/akari
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deployment environment (AKARI_ENV; forum-api pins the production domains from it, ADR 0012)
  ansible.builtin.copy:
    dest: /etc/akari/deployment.env
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      AKARI_ENV={{ akari_env }}

# 可选凭据（auction-signer）只在凭据文件已放好时写进单元：LoadCredentialEncrypted 指向不存在的文件时单元起不来
- name: Check optional service credentials
  ansible.builtin.stat:
    path: "/etc/akari/credstore/{{ item }}.cred"
  loop: "{{ app_services | map(attribute='optional_credentials', default=[]) | flatten | unique }}"
  register: app_optional_credentials

- name: Remember provisioned optional credentials
  ansible.builtin.set_fact:
    app_provisioned_credentials: >-
      {{ app_optional_credentials.results | selectattr('stat.exists') | map(attribute='item') | list }}

# Turnstile 密钥：staging / production 必填（forum-api 缺了拒绝启动）。经 -e turnstile_secret_file=<控制机本地文件>
# 传入时写进 forum-api.env（0600，与 COOKIE_SECRET 同一文件）；没传时要求文件里已经有，缺了在这里停下而不是等服务起不来。
- name: Write the Turnstile secret into forum-api.env (only when a secret file is passed)
  ansible.builtin.lineinfile:
    path: /etc/akari/forum-api.env
    regexp: "^TURNSTILE_SECRET="
    line: "TURNSTILE_SECRET={{ lookup('ansible.builtin.file', turnstile_secret_file) | trim }}"
    create: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: turnstile_secret_file is defined

- name: Look for the Turnstile secret in forum-api.env
  ansible.builtin.command: grep -qE '^TURNSTILE_SECRET=.+' /etc/akari/forum-api.env
  register: app_turnstile_secret
  changed_when: false
  check_mode: false
  failed_when: false
  when: akari_env in ['staging', 'production']

- name: Forum-api has a Turnstile secret (staging / production)
  ansible.builtin.assert:
    that: app_turnstile_secret.rc == 0
    fail_msg: /etc/akari/forum-api.env 里没有 TURNSTILE_SECRET：用 -e turnstile_secret_file=<密钥文件路径> 重跑（见 deploy/README.md「Turnstile」）
    quiet: true
  when: akari_env in ['staging', 'production']

- name: Rust service units
  ansible.builtin.template:
    src: rust.service.j2
    dest: "/etc/systemd/system/{{ item.unit }}.service"
    mode: "0644"
  loop: "{{ app_services }}"
  notify: Reload systemd

# web.env 是手写的密钥文件：只放 COOKIE_SIGNING_KEY（COOKIE_SECRET 的前 32 字节）与 API_ORIGIN。
# 整个 COOKIE_SECRET（含加密那一半）不能进 Next.js，误放时这里拒绝继续（文件还不存在时跳过）。
- name: Next.js must not hold the full COOKIE_SECRET
  ansible.builtin.command: grep -q '^COOKIE_SECRET=' /etc/akari/web.env
  register: app_web_env_full_secret
  changed_when: false
  check_mode: false
  failed_when: app_web_env_full_secret.rc == 0

- name: Next.js unit
  ansible.builtin.template:
    src: forum-web.service.j2
    dest: /etc/systemd/system/forum-web.service
    mode: "0644"
  notify: Reload systemd

- name: Enable services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: >-
    {{ app_services | selectattr('instances', 'undefined') | map(attribute='unit') | list
       + ['forum-api@1', 'forum-api@2', 'forum-web'] }}
