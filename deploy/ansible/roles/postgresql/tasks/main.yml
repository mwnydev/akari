- name: Add PGDG apt repository
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc

- name: Add Groonga apt source (PGroonga)
  ansible.builtin.apt:
    deb: "https://packages.groonga.org/debian/groonga-apt-source-latest-{{ ansible_distribution_release }}.deb"

- name: Install PostgreSQL, PGroonga and pgBackRest
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "{{ pgroonga_package }}"
      - pgbackrest
      - python3-psycopg2 # community.postgresql 模块需要
    state: present
    update_cache: true

- name: PostgreSQL tuning (plan 第 8 节)
  ansible.builtin.template:
    src: akari.conf.j2
    dest: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/akari.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql

- name: Unit drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/postgresql@{{ postgresql_version }}-main.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Soft memory limit only (hard MemoryMax would OOM-kill the database)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/postgresql@{{ postgresql_version }}-main.service.d/memory.conf"
    mode: "0644"
    content: |
      [Service]
      MemoryHigh={{ pg_memory_high }}
  notify: Restart postgresql

- name: Start PostgreSQL before creating accounts
  ansible.builtin.meta: flush_handlers

- name: Database owner role (no login)
  community.postgresql.postgresql_user:
    name: "{{ pg_owner }}"
    role_attr_flags: NOLOGIN
  become: true
  become_user: postgres

- name: Database
  community.postgresql.postgresql_db:
    name: "{{ pg_database }}"
    owner: "{{ pg_owner }}"
    encoding: UTF-8
  become: true
  become_user: postgres

# 程序账号只登录、不建对象：public 模式的 CREATE 只留给属主（PostgreSQL 15 起默认如此，这里显式写死）
- name: Application database accounts
  community.postgresql.postgresql_user:
    name: "{{ item.role }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOINHERIT
  loop: "{{ pg_app_accounts }}"
  become: true
  become_user: postgres

- name: Connect privilege for application accounts
  community.postgresql.postgresql_privs:
    login_db: "{{ pg_database }}"
    type: database
    objs: "{{ pg_database }}"
    privs: CONNECT
    roles: "{{ pg_app_accounts | map(attribute='role') | join(',') }}"
  become: true
  become_user: postgres

- name: Map service system users to their database accounts (peer auth)
  ansible.builtin.blockinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_ident.conf"
    marker: "# {mark} akari application accounts (Ansible)"
    block: |
      {% for a in pg_app_accounts %}
      akari {{ a.system_user }} {{ a.role }}
      {% endfor %}
  notify: Reload postgresql

- name: Application accounts may only connect to the forum database, as their own service user
  community.postgresql.postgresql_pg_hba:
    dest: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    contype: local
    databases: "{{ pg_database }}"
    users: "{{ pg_app_accounts | map(attribute='role') | join(',') }}"
    method: peer
    options: map=akari
  notify: Reload postgresql

# 新机器还没有迁移表：表名在解析阶段就要存在，所以先查表在不在，再查版本
- name: Migration table exists
  community.postgresql.postgresql_query:
    login_db: "{{ pg_database }}"
    query: SELECT to_regclass('public._sqlx_migrations') IS NOT NULL AS present
  register: postgresql_migrations_table
  changed_when: false
  check_mode: false
  become: true
  become_user: postgres

- name: Applied schema version
  community.postgresql.postgresql_query:
    login_db: "{{ pg_database }}"
    query: SELECT coalesce(max(version), 0) AS version FROM _sqlx_migrations WHERE success
  register: postgresql_schema_applied
  changed_when: false
  check_mode: false
  when: postgresql_migrations_table.query_result[0].present
  become: true
  become_user: postgres

- name: Remember the schema version
  ansible.builtin.set_fact:
    postgresql_schema_version: >-
      {{ postgresql_schema_applied.query_result[0].version | int
         if postgresql_migrations_table.query_result[0].present else 0 }}

- name: Table grants (per-service matrix, checked against the code by backend/crates/db/tests/grants.rs)
  ansible.builtin.template:
    src: grants.sql.j2
    dest: /etc/postgresql/akari-grants.sql
    owner: postgres
    group: postgres
    mode: "0640"
  register: postgresql_grants_file

# 授权语句都可重复执行；迁移还没跑到 pg_grants_schema_version 时（新机器、先装数据库后发版本）跳过，发版本迁移后再跑一次本 play
- name: Apply table grants
  community.postgresql.postgresql_script:
    login_db: "{{ pg_database }}"
    path: /etc/postgresql/akari-grants.sql
  when: (postgresql_schema_version | int) >= pg_grants_schema_version
  changed_when: postgresql_grants_file.changed
  become: true
  become_user: postgres
