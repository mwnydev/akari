# 版本与 plan 第 3 节一致；升级走 PR。
ansible_user: deploy
# 上传版本并执行 install-release 的账号（sudo 只能执行 install-release）。生产与 ansible_user 相同；
# sslip 测试服务器 Ansible 以 root（只用密钥）连接，另建这个账号（docs/runbooks/staging.md）。
deploy_user: deploy
ansible_port: "{{ ssh_port }}"
ssh_port: 22022
# 生产必须为 true（site.yml 断言）；只有一次性测试服务器可关
ssh_hardening: true
# SSH 不对公网开放：日常经 Cloudflare Tunnel + Access 登录（本机需装 cloudflared）。
# 源站 IP 不写进仓库；首次初始化与隧道故障时的做法见 docs/runbooks/origin-protection.md。
ansible_host: "{{ cloudflared_ssh_hostname }}"
ansible_ssh_common_args: -o ProxyCommand="cloudflared access ssh --hostname %h"
timezone: UTC

postgresql_version: 18
pgroonga_package: postgresql-18-pgdg-pgroonga
# 每个程序一个数据库账号（plan 第 2、8 节），本机 Unix socket 按系统用户 peer 认证（pg_ident 映射）。
# 授权见 roles/postgresql/templates/grants.sql.j2；迁移跑到 pg_grants_schema_version 之后才执行。
pg_database: akari
pg_owner: akari_owner
pg_app_accounts:
  - { system_user: forum-api, role: forum_api }
  - { system_user: forum-worker, role: forum_worker }
  - { system_user: forum-indexer, role: forum_indexer }
  - { system_user: forum-sponsor, role: forum_sponsor }
pg_grants_schema_version: 20261221000001
valkey_version: 9.1.2
valkey_sha256: 0d2a79936cbafa5f527a5175536bb17bd3f767f95f53529e59dddfacf762eec0 # gitleaks:allow（公开校验和）

app_root: /opt/akari
app_releases_keep: 5
# 每个程序独立系统用户（plan 第 13 节）；forum-sponsor 是唯一持有私钥的程序。
# credentials：必须有的 systemd 凭据（/etc/akari/credstore/<名字>.cred，缺了单元起不来）；
# optional_credentials：凭据文件已放好才加进单元（拍卖成交证明的 auction-signer，开放拍卖前才生成，见 deploy/README.md）
app_services:
  - { unit: forum-api@, user: forum-api, bin: forum-api, memory_max: 512M, instances: [1, 2] }
  - { unit: forum-worker, user: forum-worker, bin: forum-worker, memory_max: 1G, cpu_quota: 200% }
  - { unit: forum-indexer, user: forum-indexer, bin: forum-indexer, memory_max: 400M }
  - unit: forum-sponsor
    user: forum-sponsor
    bin: forum-sponsor
    memory_max: 100M
    credentials: [paymaster-signer, relayer-hot-wallet]
    optional_credentials: [auction-signer]

# 源站入口（docs/runbooks/origin-protection.md）：
#   tunnel：80/443 不对公网开放，网页与 SSH 都经 cloudflared（只有出站连接）；Caddy 只听本机 caddy_listen_port
#   direct：备用方案，443 只放行 Cloudflare 网段 + Authenticated Origin Pulls，DNS 需改成指向源站 IP 的代理记录
#   public：只用于没有 Cloudflare 的一次性测试服务器（akari_env 必须是 staging，site.yml 断言）：22/80/443 对公网开放，
#           Caddy 直接向 Let's Encrypt 申请证书，钱包 / 后台静态页也由 Caddy 提供（docs/runbooks/staging.md）
origin_ingress: tunnel
caddy_listen_port: 8080
# public 模式下 Caddy 另外提供的站点（空 = 不提供）：钱包、后台静态导出（取自当前版本的 wallet/、admin/），
# 图片存储（本机 SeaweedFS 的 S3 接口）与 Mailpit 网页（basic auth）
wallet_domain: ""
admin_domain: ""
media_domain: ""
mail_domain: ""

# 只用于测试服务器（akari_env 必须是 staging，site.yml 断言）：
# 本机 Mailpit（SMTP 收信，代替 Resend / Postmark）与 SeaweedFS（S3 兼容，代替 R2），见 roles/staging_local
staging_local_services: false
mailpit_version: 1.31.6
mailpit_sha256: 10fa12ccc610f653d4ed4df848c1817f9935dcf4e9a6a458a19ab0fa02093f91 # gitleaks:allow（公开校验和，与 GitHub 发布页一致）
mailpit_smtp_port: 1025
mailpit_http_port: 8025
mailpit_user: owner
caddy_mailpit_auth_file: /etc/caddy/mailpit-auth.caddy
seaweedfs_version: "3.97"
seaweedfs_sha256: a5b73384efb1b3848e8ba464420475b2e0c12c17c32d7939546cd496728849a7 # gitleaks:allow（公开校验和，与 GitHub 发布页一致）
seaweedfs_s3_port: 8333
media_bucket: akari-media
# 相对 roles/staging_local（与 install-release.sh 的写法相同）
staging_chain_config: ../../../testnet/deployments/arbitrum-sepolia/chain.toml
# install-release 接受没有 GitHub 构建证明的本地构建（还要求服务器上 AKARI_ENV=staging，见 install-release.sh）
release_allow_unattested: false

# Cloudflare Tunnel 连接器（plan 第 3 节锁版本）：GitHub 发布的单文件，sha256 与发布说明核对过
cloudflared_version: 2026.10.0
cloudflared_sha256: d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db # gitleaks:allow（公开校验和）
# 同一隧道起两个连接器（编号 1–9，指标端口 2024<编号>）：一个崩溃或滚动重启时另一个继续承载网页与 SSH
cloudflared_replicas: [1, 2]
# 隧道 UUID、SSH 主机名、Access 团队名与 AUD 按环境写在 group_vars/<环境>.yml（都不是密钥；隧道凭据见 cloudflared 角色）

# 临时放行公网 SSH 的来源网段（如 ["198.51.100.7/32"]），只在隧道无法使用时经 -e 传入；默认空 = 公网 SSH 关闭。
firewall_ssh_bootstrap_allow: []
# 出站只放行固定端口（443、DNS、NTP、隧道等），其余拒绝并记日志；SMTP 端口因此在生产不可用（只用 HTTP API 发信）
firewall_egress_enforce: true
firewall_egress_extra_tcp_ports: []

# Caddy（direct 模式）：源站证书用 Cloudflare Origin CA；只接受带 Cloudflare 客户端证书的连接（Authenticated Origin Pulls）
caddy_origin_cert: /etc/caddy/certs/origin.pem
caddy_origin_key: /etc/caddy/certs/origin.key
caddy_cf_origin_pull_ca: /etc/caddy/certs/cloudflare-origin-pull-ca.pem
api_ports: [8081, 8082]
nextjs_port: 3000
nextjs_max_conns: 64

# Next.js 运行时（plan 第 3 节：Node.js 24 LTS）
node_version: 24.22.0
node_sha256: cc2f601cee82d9a5a233302fe307abc600727035fd7d2c3a3571755989e95008 # gitleaks:allow（公开校验和）
github_repo: mwnydev/akari
