# 一次性 sslip 测试服务器（docs/runbooks/staging.md）：没有 Cloudflare 账号时，用 sslip.io 的名字（解析到服务器 IP）
# 直接对公网提供 https，Let's Encrypt 证书由 Caddy 申请。只用于 staging（site.yml 断言）。
# 服务器 IP 不进仓库：inventory/staging-sslip.local.yml（.gitignore）里给主机写 ansible_host 与 staging_sslip_base
# （如 203-0-113-7.sslip.io），生成方法见手册。这里只有不含 IP 的模板。
akari_env: staging
origin_ingress: public

# 直接以 root 连接；sshd 保持系统默认（站长决定：测试服务器保留 root 密码登录）；deploy 账号另建，只能执行 install-release
ssh_hardening: false
ansible_user: root
staging_known_hosts_file: "~/.ssh/akari_staging_known_hosts"
ansible_ssh_private_key_file: "~/.ssh/akari_staging"
ansible_ssh_common_args: "-o UserKnownHostsFile={{ staging_known_hosts_file }} -o StrictHostKeyChecking=yes"
ssh_port: 22
ansible_port: 22

site_domain: "forum.{{ staging_sslip_base }}"
wallet_domain: "wallet.{{ staging_sslip_base }}"
admin_domain: "admin.{{ staging_sslip_base }}"
media_domain: "media.{{ staging_sslip_base }}"
mail_domain: "mail.{{ staging_sslip_base }}"

staging_local_services: true
release_allow_unattested: true

# 2 核 5.8 GB、无 swap：各服务内存上限之和约 5 GB
pg_settings:
  shared_buffers: 1GB
  effective_cache_size: 3GB
  work_mem: 8MB
  maintenance_work_mem: 128MB
  random_page_cost: 1.1
  effective_io_concurrency: 200
  max_wal_size: 1GB
  checkpoint_timeout: 15min
  huge_pages: "try"
  max_connections: 60
pg_memory_high: 1536M
huge_pages_count: 0
valkey_maxmemory: 192mb
valkey_memory_max: 256M
nextjs_memory_max: 768M
