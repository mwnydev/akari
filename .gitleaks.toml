# 沿用默认规则；只放行下面明确列出的误报。
[extend]
useDefault = true

[allowlist]
description = "原样拷贝的第三方合约库；以太坊地址（恰好 20 字节，公开信息，不可能是密钥）；本地 Anvil 专用开发私钥（由公开字符串 akari-dev-only:* 派生，chain id 31337，无真实价值）"
paths = ['''^contracts/lib/''']
regexTarget = "secret"
regexes = [
  # 锚定整串：32 字节私钥长度不同，不会被这条放行
  '''^0x[0-9a-fA-F]{40}$''',
  '''^0x2bd477e315997bfc5018a2d4ef4780999f011bceb8cf602c009337739f641d81$''',
]
