[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
optimizer = true
optimizer_runs = 200
via_ir = false
# Arbitrum One (ArbOS 32+) supports Cancun opcodes (MCOPY, TSTORE/TLOAD); PUSH0 from Shanghai included.
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "../test-vectors" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
