[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
optimizer = true
optimizer_runs = 200
via_ir = false
# Arbitrum One (ArbOS 32+) supports Cancun opcodes (MCOPY, TSTORE/TLOAD); PUSH0 from Shanghai included.
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "../test-vectors" }]
# `new` in a test must stay a plain CREATE. With dynamic test linking it becomes a `vm.deployCode` cheatcode call, and
# `vm.expectRevert(...); new X(...)` then ends the test at the first expected revert, silently skipping every later
# check in it (found by mutation testing, docs/audit/freeze-checklist.md §7).
dynamic_test_linking = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
  "account-abstraction/=lib/account-abstraction/contracts/",
]

# Networks: `forge script ... --rpc-url arbitrum_sepolia` (RPC URLs and keys come from the environment).
[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }

[fuzz]
runs = 1000

[invariant]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
